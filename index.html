    const safeGetItem = (key) => {
      try {
        return window.localStorage.getItem(key);
      } catch (e) {
        console.warn("Akses LocalStorage diblokir oleh kebijakan Sandbox Iframe browser.", e);
        return null;
      }
    };

    const safeSetItem = (key, value) => {
      try {
        window.localStorage.setItem(key, value);
      } catch (e) {
        console.warn("Penyimpanan LocalStorage gagal.", e);
      }
    };

    const getLocalStorage = (key, initialValue) => {
      try {
        const item = safeGetItem(key);
        if (item === null || item === "null" || item === undefined) {
          return initialValue;
        }
        const parsed = JSON.parse(item);
        return parsed !== null ? parsed : initialValue;
      } catch (error) {
        console.error("Gagal membaca LocalStorage key: " + key, error);
        return initialValue;
      }
    };

    const setLocalStorage = (key, value) => {
      try {
        safeSetItem(key, JSON.stringify(value));
      } catch (error) {
        console.error("Gagal menyimpan ke LocalStorage key: " + key, error);
      }

      const handleSelectAnswer = (questionId, value, type) => {
        if (type === 'PG') {
          setStudentAnswers(prev => ({ ...prev, [questionId]: value }));
        } else if (type === 'PGK') {
          const currentList = studentAnswers[questionId] || [];
          let updatedList;
          if (currentList.includes(value)) {
            updatedList = currentList.filter(item => item !== value);
          } else {
            updatedList = [...currentList, value];
          }
          setStudentAnswers(prev => ({ ...prev, [questionId]: updatedList }));
        } else if (type === 'MENJODOHKAN') {
          const currentMatches = studentAnswers[questionId] || {};
          const updatedMatches = { ...currentMatches, [value.pairIndex]: value.matchedRight };
          setStudentAnswers(prev => ({ ...prev, [questionId]: updatedMatches }));
        } else if (type === 'ISIAN_SINGKAT' || type === 'URAIAN') {
          setStudentAnswers(prev => ({ ...prev, [questionId]: value }));
        }

        if (activeQuestions.length === 0) {

          return;
        }

        let correctCount = 0;
        activeQuestions.forEach(q => {
          const answer = studentAnswers[q.id];
          if (q.type === 'PG') {
            if (answer === q.correctAnswer) correctCount++;
          } else if (q.type === 'PGK') {
            const studentAnsList = answer || [];
            const correctAnsList = q.correctAnswer || [];
            const isAllCorrect = studentAnsList.length === correctAnsList.length && 
                                studentAnsList.every(val => correctAnsList.includes(val));
            if (isAllCorrect) correctCount++;
          } else if (q.type === 'MENJODOHKAN') {
            const matches = answer || {};
            let matchCorrect = true;
            (q.pairs || []).forEach((pair, index) => {
              if (matches[index] !== pair.right) {
                matchCorrect = false;
              }
            });
            if (matchCorrect) correctCount++;
          } else if (q.type === 'ISIAN_SINGKAT') {
            if (String(answer).trim().toLowerCase() === String(q.correctAnswer).trim().toLowerCase()) {
              correctCount++;
            }
          } else if (q.type === 'URAIAN') {
            if (String(answer).trim().length > 5) {
              correctCount++;
            }
          }
        });

        const listTemp = [];

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) continue;

          const cols = line.includes('\t') ? line.split('\t') : line.split(',');

          if (cols.length < 9) {
            setImportError(`Error di baris ${i + 1}: Data kurang lengkap. Harus terdapat minimal 9 kolom (NISN, Nama, Gender, Tanggal Lahir, Sesi, Username, Password, Kelas, Jurusan).`);

          const nisn = cols[0].trim();
          const name = cols[1].trim();
          const genderParsed = cols[2].trim();
          const dobRaw = cols[3].trim();
          const session = cols[4].trim();
          const usernameParsed = cols[5].trim().toLowerCase().replace(/\s+/g, '');
          const passwordParsed = cols[6].trim();
          const gradeParsed = cols[7].trim().toUpperCase();
          const majorParsed = cols[8].trim().toUpperCase();

          const dobParts = dobRaw.split('-');
          const dobDayParsed = dobParts[0] || '1';
          const dobMonthParsed = dobParts[1] || 'Januari';
          const dobYearParsed = dobParts[2] || '2005';

          listTemp.push({
            id: (Date.now() + i).toString(),
            nisn: nisn,
            name: name,
            gender: genderParsed,
            dobDay: dobDayParsed,
            dobMonth: dobMonthParsed,
            dobYear: dobYearParsed,
            session: session,
            username: usernameParsed,
            password: passwordParsed,
            grade: gradeParsed,
            major: majorParsed
          });
        }

          setImportError('Tidak ada data yang valid untuk diproses.');
        } else {
          setImportPreviewList(listTemp);

                    </div>
                  )}

                  {/* Area Pratinjau Hasil Parsing */}
                  {importPreviewList.length > 0 && (
                    <div className="border border-gray-200 rounded-xl overflow-hidden bg-white">
                      <div className="bg-slate-100 px-4 py-2 text-xs font-bold text-slate-700 uppercase border-b">
                        Pratinjau Hasil Import ({importPreviewList.length} draf peserta)
                      </div>
                      <div className="max-h-[220px] overflow-y-auto">
                        <table className="w-full text-left border-collapse text-xs">
                          <thead>
                            <tr className="bg-slate-50 border-b font-bold text-gray-500">
                              <th className="py-2 px-3">NISN</th>
                              <th className="py-2 px-3">Nama</th>
                              <th className="py-2 px-3">Kelas</th>
                              <th className="py-2 px-3">Jurusan</th>
                              <th className="py-2 px-3">Gender</th>
                              <th className="py-2 px-3">Tanggal Lahir</th>
                              <th className="py-2 px-3">Sesi</th>
                              <th className="py-2 px-3">Username / Password</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y">
                            {importPreviewList.map((st, i) => (
                              <tr key={i} className="hover:bg-slate-50">
                                <td className="py-2 px-3 font-mono">{st.nisn}</td>
                                <td className="py-2 px-3 font-bold text-gray-800 uppercase">{st.name}</td>
                                <td className="py-2 px-3 font-bold text-gray-600">{st.grade}</td>
                                <td className="py-2 px-3 font-semibold text-gray-600 uppercase truncate max-w-[120px]">{st.major}</td>
                                <td className="py-2 px-3">{st.gender}</td>
                                <td className="py-2 px-3">{st.dobDay} {st.dobMonth} {st.dobYear}</td>
                                <td className="py-2 px-3">{st.session}</td>
                                <td className="py-2 px-3 font-mono"><span className="text-blue-700 font-bold">{st.username}</span> / <span className="text-red-500 font-bold">{st.password}</span></td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                </div>

                {/* Footer Modal */}
                <div className="bg-slate-50 border-t px-6 py-4 flex justify-between items-center shrink-0">
                  <button 
                    onClick={() => {
                      setIsImportModalOpen(false);
                      setImportDataText('');
                      setImportPreviewList([]);
                      setImportError('');
                    }}
                    className="border border-gray-300 hover:bg-gray-100 text-gray-700 font-bold py-2 px-5 rounded-lg text-xs transition-colors"
                  >
                    Batal
                  </button>
                  <button 
                    onClick={handleSaveImportData}
                    disabled={importPreviewList.length === 0}
                    className="bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white font-bold py-2 px-6 rounded-lg text-xs shadow transition-colors"
                  >
                    Simpan Semua Ke Database ({(importPreviewList || []).length})
                  </button>
                </div>

              </div>
            </div>
          )}

          <footer className="bg-gray-800 text-gray-400 text-center py-4 text-xs border-t border-gray-750 no-print">
            <p>© 2026 SMK Swasta Teknologi Informatika Lohia - Program Smart CBT Mandiri. All Rights Reserved.</p>
          </footer>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
